<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewards & Coupons - Kenven Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.rewards-page{min-height:100vh}.rewards-header{text-align:center;padding:4rem 1rem 2rem}.rewards-header h1{font-family:var(--font-mono);color:var(--gold)}.rewards-subtitle{color:var(--text-secondary)}.rewards-container{max-width:850px;margin:auto;padding:1rem 1rem 4rem}.coupon-card{background:var(--card);border:1px solid var(--glass-border);border-radius:20px;padding:1.4rem;display:flex;align-items:center;gap:1rem;margin-bottom:1rem}.coupon-icon{width:56px;height:56px;display:grid;place-items:center;background:rgba(255,215,0,.1);color:var(--gold);border-radius:14px;font-size:1.3rem;flex:none}.coupon-info{flex:1}.coupon-title{font-weight:700}.coupon-desc{color:var(--text-secondary);font-size:.9rem}.coupon-code-box{display:flex;gap:.5rem;align-items:center}.coupon-code{font-family:var(--font-mono);color:var(--gold);border:1px dashed var(--gold);padding:.65rem .8rem;border-radius:10px;letter-spacing:1px;background:var(--bg-deep)}.copy-coupon-btn{width:40px;height:40px;border:1px solid var(--gold);background:var(--gold);color:#161616;border-radius:10px}.rewards-empty{text-align:center;color:var(--text-muted);padding:4rem 1rem}.back-home-link{display:block;width:max-content;margin:0 auto 4rem;color:var(--neon)}
@media(max-width:620px){.coupon-card{flex-direction:column;text-align:center}.coupon-code-box{width:100%;justify-content:center}.coupon-info{width:100%}}
</style>
</head>
<body>
<main class="rewards-page">
<header class="rewards-header"><h1><i class="fas fa-gift"></i> المكافآت والكوبونات</h1><p class="rewards-subtitle">الكوبونات التي يتحكم فيها الأدمن تظهر هنا تلقائياً.</p></header>
<section id="rewards-container" class="rewards-container"><div class="rewards-empty"><i class="fas fa-spinner fa-spin fa-2x"></i><p>جاري تحميل الكوبونات...</p></div></section>
<a href="index.html" class="back-home-link"><i class="fas fa-arrow-right"></i> العودة إلى Kenven Hub</a>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const cfg={apiKey:'AIzaSyDQ7q03kfdOQAm_B03O47GlC4v8DCru94E',authDomain:'kenven-hub.firebaseapp.com',projectId:'kenven-hub',storageBucket:'kenven-hub.firebasestorage.app',messagingSenderId:'181277894032',appId:'1:181277894032:web:7f42a19f3bcf3ea3033f15'};
firebase.initializeApp(cfg);const db=firebase.firestore();const box=document.getElementById('rewards-container');
const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML};
async function load(){try{const snap=await db.collection('coupons').where('active','==',true).get();const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.usedUp!==true);box.innerHTML=rows.length?rows.map(c=>`<article class="coupon-card"><div class="coupon-icon"><i class="fas ${esc(c.icon||'fa-ticket-alt')}"></i></div><div class="coupon-info"><div class="coupon-title">${esc(c.title||'Coupon')}</div><div class="coupon-desc">${esc(c.description||'')}</div></div><div class="coupon-code-box"><span class="coupon-code">${esc(c.code||'')}</span><button class="copy-coupon-btn" data-code="${esc(c.code||'')}"><i class="fas fa-copy"></i></button></div></article>`).join(''):'<div class="rewards-empty"><i class="fas fa-ticket-alt fa-2x"></i><p>لا توجد كوبونات متاحة حالياً.</p></div>';box.querySelectorAll('.copy-coupon-btn').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code)}catch(e){const t=document.createElement('textarea');t.value=b.dataset.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.innerHTML='<i class="fas fa-check"></i>';setTimeout(()=>b.innerHTML='<i class="fas fa-copy"></i>',1200)})}catch(e){box.innerHTML='<div class="rewards-empty"><i class="fas fa-triangle-exclamation fa-2x"></i><p>تعذر تحميل الكوبونات.</p></div>'}}load();
</script>
</body>
</html>
